services:
  - type: web
    name: bulk-email-agent-n8n
    runtime: docker
    plan: starter
    healthCheckPath: /healthz/readiness
    dockerfilePath: ./Dockerfile
    envVars:
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "false"
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_EDITOR_BASE_URL
        value: https://${RENDER_EXTERNAL_HOSTNAME}
      - key: WEBHOOK_URL
        value: https://${RENDER_EXTERNAL_HOSTNAME}/
      - key: N8N_SECURE_COOKIE
        value: "true"
      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"
    disk:
      name: bulk-email-agent-data
      mountPath: /files
      sizeGB: 1
